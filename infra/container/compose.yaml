name: infra-scolarite
services:

  auth-service:
    container_name: keycloak-3
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev"]
    restart: always
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.2

  db:
    image: postgres:16.10-alpine
    container_name: postgres-16.10-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 5s
          timeout: 5s
          retries: 5
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.3

# Docker gère le volume dans son propre répertoire, pas dans l'arborescence du projet.
# Un docker compose down sans -v les conservera. Seul docker compose down -v les supprimera.
volumes:
  postgres-data:

networks:
  scolarite-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.2.0/24