name: infra-scolarite
services:

  auth-service:
    container_name: keycloak-3
    # Version épinglée. « latest » exposait à deux dérives : la version pouvait
    # changer au premier `pull` sans que rien ne le signale, et surtout un dump
    # de la base `keycloak` restauré plus tard dans une version plus récente
    # peut migrer son schéma de façon irréversible. Une sauvegarde n'a de sens
    # qu'associée à une version connue.
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev"]
    restart: always
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # Thèmes de connexion (infra/keycloak/themes, un dossier par thème),
      # lus directement par Keycloak sans étape `build` ; en `start-dev` ils
      # ne sont pas mis en cache, une modification se voit au rechargement.
      # Lecture seule : le conteneur n'a rien à y écrire. Le realm est
      # rattaché au thème « scolarite » par `login_theme` dans
      # infra/keycloak/keycloak.tf.
      - ../keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.2

  # [DEV-LOCAL] Serveur SMTP de développement : capte les courriels envoyés
  # par Keycloak (définition de mot de passe) sans jamais rien délivrer.
  # Interface web publiée sur l'hôte (http://localhost:8025, aussi joignable
  # via http://10.20.2.6:8025) pour consultation navigateur et Playwright.
  # À exclure lors du chantier de séparation des environnements.
  mail-service:
    container_name: mailpit
    # Version épinglée (le tag amont porte un « v » initial).
    image: axllent/mailpit:v1.30.7
    restart: always
    ports:
      - "8025:8025" # interface web, exposée à l'hôte
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.6

  # Service de conversion HTML → PDF (Gotenberg), consommé par le backend pour
  # la fiche et le livret syllabus (lot 5) et, à venir, les bulletins de jury
  # — client dans back/pkg/services/pdf.go, adresse GOTENBERG_HOST des
  # config-*.env. Infrastructure et non image applicative : il vit ici, avec
  # PostgreSQL et Keycloak, et les deux makefiles (local, prod) le démarrent.
  # Version épinglée ; Chromium seul (les routes LibreOffice sont fermées, le
  # backend n'en a pas l'usage) et sans JavaScript : les documents envoyés sont
  # des HTML autonomes, feuille de style en ligne, aucune ressource externe.
  # Jamais publié sur l'hôte : seul le backend lui parle, sur le réseau Docker.
  pdf-service:
    container_name: gotenberg
    image: gotenberg/gotenberg:8.37.0
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --libreoffice-disable-routes=true
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.7

  db:
    # Déjà épinglé. PG_CONTAINER (infra/env/config-*.env) reprend cette version
    # dans le nom du conteneur : les deux se changent ensemble.
    image: postgres:16.10-alpine
    container_name: ${PG_CONTAINER}
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 5s
          timeout: 5s
          retries: 5
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.3

# Docker gère le volume dans son propre répertoire, pas dans l'arborescence du projet.
# Un docker compose down sans -v les conservera. Seul docker compose down -v les supprimera.
volumes:
  postgres-data:

networks:
  scolarite-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.2.0/24