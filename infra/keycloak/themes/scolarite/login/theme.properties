# Thème de connexion « scolarite » : keycloak.v2 (PatternFly v5) habillé aux
# couleurs du front. Aucun gabarit FreeMarker ici — balisage, scripts et
# mécanique viennent du parent ; seuls s'ajoutent une feuille et un script
# (resources/). Le realm y est rattaché par `login_theme` dans keycloak.tf,
# le dossier est monté dans le conteneur par infra/container/compose.yaml.
parent=keycloak.v2
import=common/keycloak

# `styles` REMPLACE la propriété du parent (les propriétés ne s'additionnent
# pas) : on relit donc sa feuille css/styles.css — résolue à travers la
# hiérarchie des thèmes, elle n'est pas recopiée — avant la nôtre, qui a ainsi
# le dernier mot à spécificité égale. `stylesCommon` (PatternFly v5) et
# `darkMode=true` restent hérités : c'est le script du parent qui pose la
# classe pf-v5-theme-dark, le nôtre ne fait que la corriger.
styles=css/styles.css css/custom.css
scripts=js/mode-couleur.js
