worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx_access.log;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ── IP réelle du client (lot sécurité réseau) ────────────────────────────
    # Remplace l'ancien `map $http_x_real_ip` qui faisait confiance à un
    # en-tête entièrement forgeable par le client. Le module real_ip ne
    # réécrit $remote_addr que si la connexion arrive d'une adresse listée
    # dans NGINX_TRUSTED_PROXIES (rendu par start-scolarite.sh) — nginx étant
    # aujourd'hui le bord du réseau (aucun proxy amont), cette liste est vide
    # de confiance par défaut (127.0.0.1/32, voir infra/env/config-*.env) :
    # $remote_addr reste alors l'adresse TCP réelle du client, jamais un
    # en-tête qu'il aurait fourni lui-même.
    set_real_ip_from ${NGINX_TRUSTED_PROXIES};
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # ── Quotas réseau (lot sécurité réseau) ──────────────────────────────────
    # Dimensionnement détaillé dans le rapport du lot. client_max_body_size
    # dépasse volontairement le plafond Go (12 Mo, cfg.Server.MaxBodyBytes) :
    # une requête entre les deux tailles atteint le backend et reçoit un 413
    # RFC 9457 propre au lieu de la page nginx brute que produirait un rejet
    # ici.
    client_max_body_size 15m;
    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 30s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    # > WriteTimeout du backend (30s, cfg.Server.WriteTimeout) : sinon nginx
    # renverrait un 502 sur une réponse que le backend aurait fini d'écrire.
    proxy_read_timeout 35s;

    # limit_req répond 503 par défaut ; 429 est le code que
    # errorMessages.ts sait déjà traduire.
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ── Pages d'erreur RFC 9457 générées par nginx lui-même ──────────────────
    # `proxy_intercept_errors` vaut `off` par défaut : ces pages ne
    # remplacent donc jamais un 413/429 émis par le backend (déjà en
    # application/problem+json), seulement ceux que nginx produit avant même
    # d'atteindre le backend (client_max_body_size, limit_req). Les codes et
    # messages reprennent le contrat de back/pkg/services/errors.go et
    # front/src/services/errorMessages.ts — même enveloppe, quelle que soit
    # la couche qui répond.
    # Sans extension .json : avec elle, la carte MIME de nginx
    # (include mime.types) impose application/json sur la redirection
    # interne, avant même que default_type ci-dessous ne s'applique.
    error_page 413 /errors/413;
    error_page 429 /errors/429;

    server {
        listen 9020;
        listen [::]:9020;
        return 301 https://$host:9021$request_uri;
    }

    server {
        listen 9021 ssl;
        listen [::]:9021 ssl;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # ── En-têtes de sécurité (lot sécurité réseau) ─────────────────────
        # Posés dans location / et /api/ (et les pages d'erreur ci-dessous),
        # PAS au niveau de ce bloc server : Keycloak (/auth) émet déjà sa
        # propre Content-Security-Policy (frame-ancestors 'self', pour son
        # iframe de vérification de session SSO) — un add_header hérité ici
        # s'additionnerait à la sienne, et la CSP effective d'un navigateur
        # est l'intersection des deux : notre frame-ancestors 'none' aurait
        # cassé du Keycloak qui n'a rien à voir avec notre CSP applicative.
        # Constaté en testant le login (Étape 4, contrôle #2) — pas une
        # précaution théorique.
        #
        # `always` : envoyés aussi sur les réponses d'erreur (4xx/5xx), pas
        # seulement les 2xx — dont les pages RFC 9457 ci-dessous.
        #
        # HSTS sans condition : ce serveur ne sert QUE du HTTPS (le port 9020
        # ne fait que rediriger) dans les deux modes qui passent par nginx
        # (local-keep et prod-keep) — pas de variante HTTP à distinguer. Le
        # mode `npm run dev` (Vite) ne passe jamais par nginx, HSTS ne le
        # concerne donc pas non plus. Pas de `preload` : c'est un engagement
        # global au-delà du périmètre de ce lot.

        location /auth {
            proxy_pass http://keycloak-3:8080;
            proxy_set_header Host $host;
            # $remote_addr porte déjà la décision du module real_ip
            # ci-dessus : l'IP réelle si la connexion vient d'un proxy amont
            # de confiance, l'IP TCP brute sinon — jamais un en-tête que le
            # client aurait pu forger. C'est cette valeur que Keycloak
            # consomme pour ses journaux d'audit (KC_PROXY_HEADERS=xforwarded,
            # infra/container/compose.yaml).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://scolarite-backend:3333;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location / {
            try_files $uri $uri/ /index.html;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # CSP testée contre l'app réelle (Étape 4, contrôle #2), pas
            # recopiée d'un modèle. Trois compromis constatés, pas supposés :
            #   - style-src 'unsafe-inline' : MUI/Emotion injecte du CSS au
            #     runtime sans nonce ;
            #   - font-src data: : l'icône-police de FullCalendar
            #     (fcicons) s'embarque en base64, pas en fichier ;
            #   - script-src 'unsafe-eval' : une dépendance (Recharts ou
            #     MUI X, non isolée précisément) appelle eval/Function au
            #     rendu du tableau de bord.
            # Keycloak est proxié en /auth sous ce même domaine : connect-src
            # 'self' suffit, pas d'hôte externe à lister.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /errors/413 {
            internal;
            default_type application/problem+json;
            return 413 '{"type":"/erreurs/file-too-large","title":"Fichier trop volumineux","status":413,"code":"FILE_TOO_LARGE","detail":"Le fichier dépasse la taille maximale autorisée."}';

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        location = /errors/429 {
            internal;
            default_type application/problem+json;
            return 429 '{"type":"/erreurs/rate-limited","title":"Trop de requêtes","status":429,"code":"RATE_LIMITED","detail":"Trop de requêtes en peu de temps. Merci de patienter quelques secondes avant de réessayer."}';

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
}
