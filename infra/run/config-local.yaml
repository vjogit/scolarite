database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${SCOLARITE_USER}
  password: ${SCOLARITE_PASSWORD}
  name: ${SCOLARITE_DB}

server:
  host: localhost
  port: 3333

keycloak:
  host: http://${KC_INTERNAL_HOSTNAME}:8080${KC_HTTP_RELATIVE_PATH}
  issuer: ${KC_HOSTNAME}
  realm: realms/${KC_REALM}
  client: ${KC_CLIENT_ID}
  backend_client_id: ${KC_BACKEND_CLIENT_ID}
  backend_client_secret: ${KC_BACKEND_CLIENT_SECRET}
  # [DEV-LOCAL] CA mkcert : l'issuer (vite/nginx) est servi avec un certificat
  # mkcert que le conteneur ne connaît pas. La CA est copiée dans le dossier de
  # conf par start-scolarite-local.sh. La vérification TLS reste active.
  ca_cert: /opt/scolarite/conf/rootCA.pem
