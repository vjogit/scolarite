name: scolarite

services:
  # Chaque service porte un nom d'image ET une recette de build : en mode
  # « build » (poste, CI), `up --build` construit et tague l'image sous ce nom ;
  # en mode « pull » (prod, ou répétition sur le poste), `up --no-build` prend
  # l'image telle quelle, tirée du registre si IMAGES_REGISTRE est renseigné.
  # Les trois variables IMAGES_* viennent de infra/env/config-<env>.env, par
  # start-scolarite.sh, qui les laisse surcharger sur la ligne de commande.
  backend:
    container_name: scolarite-backend
    image: ${IMAGES_REGISTRE:-}scolarite-backend:${IMAGES_TAG:-latest}
    build:
      context: ../../
      dockerfile: infra/run/build/Dockerfile
      # local = backend + Delve, prod = backend seul. Positionné par
      # infra/run/start-scolarite.sh selon l'espace de travail.
      target: ${BACKEND_TARGET:-local}
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    volumes:
      # SCOLARITE_CONF_DIR : répertoire hôte où start-scolarite.sh dépose le
      # config.yaml de l'espace de travail. Défini dans le fichier de secrets.
      - ${SCOLARITE_CONF_DIR}:/opt/scolarite/conf:ro
    env_file:
      # Chemins absolus des deux fichiers d'environnement, fournis par
      # start-scolarite.sh ou par la cible stop-* du makefile. Topologie puis
      # secrets — voir infra/env/README.md.
      - ${CONFIG_FILE}
      - ${SECRETS_FILE}
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.4
    restart: unless-stopped

  nginx:
    container_name: scolarite-nginx
    image: ${IMAGES_REGISTRE:-}scolarite-nginx:${IMAGES_TAG:-latest}
    build:
      context: ../../
      dockerfile: infra/run/build/Dockerfile
      target: nginx
    volumes:
      # Rendu par start-scolarite.sh dans le même répertoire que le
      # config.yaml du backend (${SCOLARITE_CONF_DIR}) — un seul fichier,
      # montage direct plutôt que le répertoire entier.
      - ${SCOLARITE_CONF_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificat TLS (nginx.crt + nginx.key), hors de l'image : mkcert en
      # local, déposé par start-scolarite.sh ; le certificat réel en prod.
      - ${SCOLARITE_CONF_DIR}/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      scolarite-net:
        ipv4_address: 10.20.2.5
    restart: unless-stopped

networks:
  scolarite-net:
    external: true
    name: infra-scolarite_scolarite-net
