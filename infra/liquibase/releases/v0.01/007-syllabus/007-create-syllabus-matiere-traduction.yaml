databaseChangeLog:
  - changeSet:
      id: 007-create-syllabus-matiere-traduction
      author: dev
      comment: "Traduction de la fiche syllabus d'une matière (lot 6), 1-1 par (fiche, langue), les huit rubriques. Suit la fiche par cascade (donc la matière). Le français fait référence : la traduction est un dérivé stocké, jamais une seconde source. langue en colonne (seul en est visé, fr est refusé : la source n'est pas une traduction). version_source et empreinte_source disent de quelle source la traduction est tirée — l'empreinte juge la péremption (changeset 006), la version informe. statut : automatique (la machine propose) ou relue (le rédacteur dispose) ; retraduire fait perdre relue. modele : le dernier traducteur automatique passé, nul pour une traduction saisie à la main. version : verrou optimiste de l'écran de relecture. Péremption signalée, jamais bloquante : aucune contrainte ne lie la traduction à l'état de sa source."
      changes:
        - createTable:
            tableName: syllabus_matiere_traduction
            columns:
              - column:
                  name: matiere_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: langue
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column: { name: contexte, type: TEXT }
              - column: { name: objectifs, type: TEXT }
              - column: { name: prerequis, type: TEXT }
              - column: { name: activites, type: TEXT }
              - column: { name: evaluation, type: TEXT }
              - column: { name: plan_cours, type: TEXT }
              - column: { name: ressources, type: TEXT }
              - column: { name: dimension_socio_env, type: TEXT }
              - column:
                  name: version_source
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: empreinte_source
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: statut
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column: { name: modele, type: TEXT }
              - column:
                  name: traduit_le
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - addPrimaryKey:
            constraintName: pk_syllabus_matiere_traduction
            tableName: syllabus_matiere_traduction
            columnNames: matiere_id, langue

        - addForeignKeyConstraint:
            constraintName: fk_syllabus_matiere_traduction_fiche
            baseTableName: syllabus_matiere_traduction
            baseColumnNames: matiere_id
            referencedTableName: syllabus_matiere
            referencedColumnNames: matiere_id
            onDelete: CASCADE

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE syllabus_matiere_traduction ADD CONSTRAINT chk_syllabus_matiere_traduction_statut CHECK (statut IN ('automatique', 'relue'));
              ALTER TABLE syllabus_matiere_traduction ADD CONSTRAINT chk_syllabus_matiere_traduction_langue CHECK (langue ~ '^[a-z]{2}$' AND langue <> 'fr');

      rollback:
        - dropTable:
            tableName: syllabus_matiere_traduction
            cascadeConstraints: true
