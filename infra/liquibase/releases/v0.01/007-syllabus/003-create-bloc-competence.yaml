databaseChangeLog:
  - changeSet:
      id: 003-create-bloc-competence
      author: dev
      comment: "Bloc de compétences du référentiel d'une promotion (lot 3 syllabus, rattaché à la promotion au lot compétences-promotion du 16 septembre 2026 — changeset réécrit en place, aucun déploiement n'existait). Les compétences varient d'une promotion à l'autre (INFRES18 ≠ INFRES19), comme la structure est dupliquée par promotion : le bloc porte promotion_id et suit sa promotion par cascade (la purge de la corbeille l'emporte). Champs calqués sur le document France Compétences : libellé, code nullable (les blocs du document sont numérotés, pas codés — la colonne est réservée à un éventuel code RNCP officiel), activités exercées, modalités et critères d'évaluation. L'ordre est une position, unique par promotion ; le code affiché « C{ordre} » des compétences en dérive à l'affichage, jamais stocké."
      changes:
        - createTable:
            tableName: bloc_competence
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: promotion_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bloc_competence_promotion
                    referencedTableName: promotion
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: ordre
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: libelle
                  type: TEXT
                  constraints:
                    nullable: false
              - column: { name: code, type: TEXT }
              - column: { name: activites, type: TEXT }
              - column: { name: modalites_evaluation, type: TEXT }

        - addUniqueConstraint:
            constraintName: uk_bloc_competence_ordre
            tableName: bloc_competence
            columnNames: promotion_id, ordre

        - createIndex:
            indexName: idx_bloc_competence_promotion
            tableName: bloc_competence
            columns:
              - column: { name: promotion_id }

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE bloc_competence ADD CONSTRAINT chk_bloc_competence_ordre_positive CHECK (ordre > 0);
              ALTER TABLE bloc_competence ADD CONSTRAINT chk_bloc_competence_libelle_length CHECK (length(libelle) > 0);

      rollback:
        - dropTable:
            tableName: bloc_competence
            cascadeConstraints: true
