databaseChangeLog:
  - changeSet:
      id: 012-create-indexes-structure
      author: dev
      comment: "Index de performance sur les jointures de structure (UE, matiere, controle, periode, option, note)"
      changes:
        - createIndex:
            indexName: idx_ue_periode_id
            tableName: unite_enseignement
            schemaName: public
            columns:
              - column:
                  name: periode_id

        - createIndex:
            indexName: idx_matiere_ue_id
            tableName: matiere
            schemaName: public
            columns:
              - column:
                  name: unite_enseignement_id

        - createIndex:
            indexName: idx_controle_matiere_id
            tableName: controle
            schemaName: public
            columns:
              - column:
                  name: matiere_id

        - createIndex:
            indexName: idx_periode_option_id
            tableName: periode
            schemaName: public
            columns:
              - column:
                  name: option_id

        - createIndex:
            indexName: idx_option_promotion_id
            tableName: option
            schemaName: public
            columns:
              - column:
                  name: promotion_id

        - createIndex:
            indexName: idx_note_user_id
            tableName: note
            schemaName: public
            columns:
              - column:
                  name: user_id

      rollback:
        - dropIndex:
            indexName: idx_ue_periode_id
            tableName: unite_enseignement
            schemaName: public
        - dropIndex:
            indexName: idx_matiere_ue_id
            tableName: matiere
            schemaName: public
        - dropIndex:
            indexName: idx_controle_matiere_id
            tableName: controle
            schemaName: public
        - dropIndex:
            indexName: idx_periode_option_id
            tableName: periode
            schemaName: public
        - dropIndex:
            indexName: idx_option_promotion_id
            tableName: option
            schemaName: public
        - dropIndex:
            indexName: idx_note_user_id
            tableName: note
            schemaName: public

  - changeSet:
      id: 012-create-index-note-covering
      author: dev
      comment: "Index partiel couvrant PostgreSQL pour le calcul des notes (INCLUDE + WHERE)"
      dbms: postgresql
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_note_perf_stats ON public.note(controle_id, user_id) INCLUDE (note) WHERE note IS NOT NULL;

      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS public.idx_note_perf_stats;
