databaseChangeLog:
  - changeSet:
      id: 003-create-option
      author: dev
      comment: "Création de la table option (FK → promotion)"
      changes:
        - createTable:
            tableName: option
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: promotion_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_option_promotion
                    referencedTableName: promotion
                    referencedColumnNames: id
                    deleteCascade: true

        - sql:
            dbms: postgresql
            sql: ALTER TABLE option ADD CONSTRAINT chk_option_name_length CHECK (length(name) > 0);

      rollback:
        - dropTable:
            tableName: option
            cascadeConstraints: true
