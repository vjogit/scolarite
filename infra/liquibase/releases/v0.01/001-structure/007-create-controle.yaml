databaseChangeLog:
  - changeSet:
      id: 007-create-controle
      author: dev
      comment: "Création de la table controle (FK → matiere)"
      changes:
        - createTable:
            tableName: controle
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: coeff
                  type: REAL
                  constraints:
                    nullable: false
              - column:
                  name: is_rattrapage
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: remarque
                  type: TEXT
              - column:
                  name: matiere_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_controles_matieres
                    referencedTableName: matiere
                    referencedColumnNames: id
                    deleteCascade: true

      rollback:
        - dropTable:
            tableName: controle
            cascadeConstraints: true
