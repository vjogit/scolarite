databaseChangeLog:
  - changeSet:
      id: 002-create-salle
      author: dev
      comment: "Création de la table salle (ressource physique réservable)"
      changes:
        - createTable:
            tableName: salle
            schemaName: public
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: salle_pkey
                    nullable: false
              - column:
                  name: version
                  type: integer
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: capacite
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: equipement
                  type: text
              - column:
                  name: type_salle
                  type: text
                  remarks: "AMPHI, TD, TP, LABO, INFORMATIQUE"
              - column:
                  name: batiment
                  type: text

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE public.salle ADD CONSTRAINT chk_salle_capacite CHECK (capacite > 0);
              ALTER TABLE public.salle ADD CONSTRAINT chk_salle_name_length CHECK (length(name) > 0);

      rollback:
        - dropTable:
            tableName: salle
            schemaName: public
            cascadeConstraints: true