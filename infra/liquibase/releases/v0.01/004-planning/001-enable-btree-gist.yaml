databaseChangeLog:
  - changeSet:
      id: 001-enable-btree-gist
      author: dev
      comment: "Activation de l'extension btree_gist, requise pour les contraintes d'exclusion sur tstzrange"
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS btree_gist;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS btree_gist;
