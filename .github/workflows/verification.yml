# Vérification sans infrastructure : lint et build du front, build et tests
# unitaires du back. C'est le premier filet — il ne demande ni base, ni
# Keycloak, ni navigateur, et tourne en quelques minutes sur chaque push et
# chaque pull request. La suite Playwright, qui exige la stack complète, a son
# propre workflow (e2e.yml). Voir docs/ci.md pour ce que ces deux workflows
# couvrent, et surtout ce qu'ils ne couvrent pas.

name: Vérification

on:
  push:
  pull_request:

jobs:
  front:
    name: Front — lint et build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      # Node 22 : la version de l'image node:22-alpine qui construit le front
      # servi par nginx (infra/run/build/Dockerfile) — la CI vérifie ce que la
      # stack sert, pas la version du poste.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      # `npm ci` installe exactement le lockfile et s'arrête si package.json
      # et package-lock.json divergent : c'est lui qui garantit qu'aucune
      # montée de version ne se produit sur l'exécuteur.
      - name: Dépendances (npm ci)
        run: npm ci

      # Les deux versions épinglées pendant la migration shadcn (dette
      # « versions à réévaluer » de CLAUDE.md) sont vérifiées explicitement :
      # une montée y serait invisible d'un build vert. `git diff` confirme que
      # l'installation n'a pas réécrit le lockfile.
      - name: Versions épinglées — aucune montée
        run: |
          attendu() {
            local paquet="$1" version="$2" installee
            installee=$(node -p "require('$paquet/package.json').version")
            if [ "$installee" != "$version" ]; then
              echo "::error title=Montée de version::$paquet $installee installé, $version attendu"
              exit 1
            fi
            echo "$paquet $installee — conforme"
          }
          attendu react-day-picker 9.14.0
          attendu @tanstack/react-table 8.20.6
          git diff --exit-code package-lock.json

      - name: Lint
        run: npm run lint

      - name: Build (mode production)
        run: npm run build

  back:
    name: Back — build et tests Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      # Le code généré par sqlc (back/pkg/**/gen/) est versionné (tranché le
      # 4 septembre 2026 ; jusque-là .gitignore l'excluait et un clone neuf ne
      # compilait pas). Cette étape le régénère hors ligne — sqlc lit
      # back/schema.sql, versionné — et échoue si le résultat diffère du
      # commit : une requête ou un changeset modifié sans régénération, ou une
      # régénération non committée, se voit ici et nulle part ailleurs (le
      # build passerait sur du généré obsolète). Version épinglée sur celle du
      # poste.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - name: Code sqlc — régénéré, identique au commit
        run: |
          sqlc generate
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            git diff -- . | head -n 200
            echo "::error title=Généré sqlc obsolète::back/pkg/**/gen/ diffère de « sqlc generate » — régénérer (infra/gen_sql.sh) et committer avec la requête"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # Tous les paquets, sans exception : programme-import/pkg/extraction lit
      # ses fixtures dans testdata/ depuis le 17 septembre 2026 (docs/ci.md
      # §12) — l'étape « défaut connu, non bloquant » qui le rejouait a
      # disparu avec le défaut. Les tests d'intégration (base, Keycloak,
      # Mailpit) se sautent d'eux-mêmes ici, sans TEST_DB_URL (t.Skip
      # explicite) : ils tournent dans le job e2e, contre sa stack (§11).
      - name: Tests
        run: go test ./...
