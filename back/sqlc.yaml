version: "2"
overrides:
  go:
    overrides:
      - db_type: "my_null_float"
        engine: "postgresql"
        go_type:
          type: "float64"
          pointer: true
      - db_type: "my_null_string"
        engine: "postgresql"
        go_type:
          type: "string"
          pointer: true
      - db_type: "my_null_bool"
        engine: "postgresql"
        go_type:
          type: "bool"
          pointer: true
      - db_type: "my_null_integer"
        engine: "postgresql"
        go_type:
          type: "int32"
          pointer: true

