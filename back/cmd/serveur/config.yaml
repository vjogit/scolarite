# Configuration du serveur — SOURCE UNIQUE.
#
# Ce fichier sert les deux façons de lancer le backend :
#   * hors conteneur, depuis le debugger VSCode, qui le passe en argument et
#     résout les ${VAR} avec os.Expand (back/pkg/services/config.go) ;
#   * en conteneur, où infra/run/start-scolarite.sh le rend avec envsubst et
#     dépose le résultat dans $SCOLARITE_CONF_DIR/config.yaml, monté en
#     lecture seule sur /opt/scolarite/conf/config.yaml.
#
# Il n'y a donc plus de gabarits infra/run/config-{local,prod}.yaml : ils
# recopiaient celui-ci à une ligne près et divergeaient à la première retouche.
# Les valeurs viennent de infra/env/config-<env>.env et secrets-<env>.env.
database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${SCOLARITE_USER}
  password: ${SCOLARITE_PASSWORD}
  name: ${SCOLARITE_DB}
  # Mode TLS de la connexion PostgreSQL (lot sécurité réseau). Vide vaut
  # disable — voir infra/env/config-{local,prod}.env pour la valeur par
  # environnement, et DatabaseConfig.SSLMode pour le défaut sûr documenté.
  sslmode: ${SCOLARITE_DB_SSLMODE}
  sslrootcert: ${SCOLARITE_DB_SSLROOTCERT}

server:
  host: localhost
  port: 3333
  # Timeouts http.Server et plafond global de requête (lot sécurité réseau).
  # Valeurs identiques quel que soit l'environnement — ce ne sont pas des
  # coordonnées de déploiement, elles restent donc en littéral ici plutôt
  # que dans infra/env/*.env. Dimensionnement détaillé dans le rapport du
  # lot : readTimeout couvre un import de maxBodyBytes sur une connexion
  # lente, writeTimeout la génération des bulletins ZIP d'une grosse période
  # (mesurée), readHeaderTimeout et idleTimeout sont des valeurs usuelles.
  readHeaderTimeout: 5s
  readTimeout: 60s
  writeTimeout: 30s
  idleTimeout: 120s
  maxBodyBytes: 12582912 # 12 Mo ; nginx (client_max_body_size) accepte plus haut pour laisser ce plafond répondre en RFC 9457

# Niveau minimum des logs : debug, info, warn ou error. Vide vaut info ; une
# valeur inconnue arrête le démarrage. Hors conteneur, si la variable n'est
# pas définie, os.Expand rend la chaîne vide et le défaut s'applique.
log:
  level: ${SCOLARITE_LOG_LEVEL}

# Ancrage RFC 3161 et témoin externe du registre chaîné (portage rex-imt,
# backend/admin/cmd/config.yaml bloc presence). L'ancrage OBSERVE la chaîne,
# il ne la gouverne pas : aucun échec ici ne bloque une écriture de note ou de
# jury.
registre:
  timestamp:
    # Vide vaut false : un binaire lancé hors contexte n'ancre pas dans le
    # vide. Activé par environnement (infra/env/config-<env>.env).
    enabled: ${REGISTRE_ANCRAGE_ENABLED}
    urls:
      - https://freetsa.org/tsr        # valeur par défaut ; ajouter d'autres TSA pour redondance
    hashAlgorithm: sha256
    timeout: 10s
    # L'ancrage automatique tourne toutes les heures (ordonnanceur intégré) ;
    # aucune ancre n'est créée si la tête de chaîne n'a pas bougé.
    # Certificat racine FreeTSA — obtenu par un acte VISIBLE :
    # `make fetch-freetsa-cert` (empreinte affichée, à
    # confronter à https://freetsa.org). Jamais commité, jamais téléchargé au
    # démarrage. Archivé avec chaque jeton pour rester vérifiable même si la
    # TSA disparaît.
    caCertPath: ${REGISTRE_TSA_CA_CERT}
  # Témoin externe : après chaque nouvelle ancre, la tête de chaîne (seq + hash
  # + jeton RFC 3161 + cert TSA) est envoyée vers une boîte EXTERNE.
  # EXIGENCES DE DÉPLOIEMENT (voir docs/rgpd-registre.md) :
  #   - la boîte destinataire doit être gérée par un rôle distinct de l'admin infra ;
  #   - le compte SMTP ci-dessous ne doit avoir QUE le droit d'envoi.
  witness:
    enabled: ${REGISTRE_TEMOIN_ENABLED}
    recipients:
      - ${REGISTRE_TEMOIN_RECIPIENT}
    smtp:
      host: ${REGISTRE_SMTP_HOST}
      port: ${REGISTRE_SMTP_PORT}
      username: ${REGISTRE_SMTP_USER}
      password: ${REGISTRE_SMTP_PASSWORD}
      from: ${REGISTRE_SMTP_FROM}
      startTLS: ${REGISTRE_SMTP_STARTTLS}
      timeout: 10s

keycloak:
  host: http://${KC_INTERNAL_HOSTNAME}:8080${KC_HTTP_RELATIVE_PATH}
  issuer: ${KC_HOSTNAME}
  realm: realms/${KC_REALM}
  client: ${KC_CLIENT_ID}
  backend_client_id: ${KC_BACKEND_CLIENT_ID}
  backend_client_secret: ${KC_BACKEND_CLIENT_SECRET}
  # Bundle PEM ajouté aux CA de confiance pour la découverte OIDC. Vide = CA
  # système, et le backend s'en contente (AuthMiddleware.go). C'est le cas hors
  # conteneur — la CA mkcert est dans le trust store de la machine — et en prod,
  # où l'issuer porte un certificat public.
  #
  # [DEV-LOCAL] Seul le conteneur local a besoin d'une valeur : il ne connaît
  # pas la CA mkcert qui signe l'issuer. start-scolarite.sh l'y dépose et
  # positionne cette variable. La vérification TLS reste active : jamais
  # d'InsecureSkipVerify.
  ca_cert: ${SCOLARITE_CA_CERT}
